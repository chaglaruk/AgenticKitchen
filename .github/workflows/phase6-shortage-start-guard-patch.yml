name: Phase 6 shortage start guard

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase6-shortage-start-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply shortage start guard
        run: python3 .github/scripts/phase6_shortage_start_guard_patch.py
      - name: Validate shortage start guard
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase6-shortage-start-guard-patch.yml .github/scripts/phase6_shortage_start_guard_patch.py
          git add -A
          git diff --cached --check
          git commit -m "fix: block cooking while recipe shortages remain"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
