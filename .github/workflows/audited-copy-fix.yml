name: Audited copy fix

on:
  push:
    branches:
      - refactor/agentic-kitchen-production-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply audited UI copy fixes and tests
        shell: python
        run: |
          from pathlib import Path

          options = Path('app-android/src/main/java/com/agentickitchen/android/ui/OptionsScreen.kt')
          text = options.read_text()
          marker = '''internal fun recipeTypeLabel(type: String, isTurkish: Boolean): String {
'''
          helper = '''internal fun localizedRecipeSourceLabel(sourceLabel: String?, isTurkish: Boolean): String? = when {
    sourceLabel.isNullOrBlank() -> null
    sourceLabel.equals("Offline", ignoreCase = true) -> if (isTurkish) "ÇEVRİMDIŞI" else "OFFLINE"
    else -> sourceLabel
}

'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('OptionsScreen helper marker not found')
              text = text.replace(marker, helper + marker, 1)
          old = 'listOfNotNull(recipeTypeLabel(option.type, L.isTr), option.sourceLabel).joinToString(" · ")'
          new = 'listOfNotNull(recipeTypeLabel(option.type, L.isTr), localizedRecipeSourceLabel(option.sourceLabel, L.isTr)).joinToString(" · ")'
          if old not in text and new not in text:
              raise SystemExit('OptionsScreen source label expression not found')
          text = text.replace(old, new, 1)
          options.write_text(text)

          operations = Path('app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt')
          text = operations.read_text()
          old = '''        if (step.dependsOn.isNotEmpty()) {
            add(
                if (L.isTr) "${step.dependsOn.joinToString()} sonrasında"
                else "after ${step.dependsOn.joinToString()}"
            )
        }
'''
          new = '''        cookingDependencyLabel(step.dependsOn.size, L.isTr)?.let(::add)
'''
          if old not in text and new not in text:
              raise SystemExit('OperationsScreen dependency expression not found')
          text = text.replace(old, new, 1)
          helper_marker = '''@Composable
private fun EditorialPlanStep(number: Int, step: CookingStepDto) {
'''
          dependency_helper = '''internal fun cookingDependencyLabel(dependencyCount: Int, isTurkish: Boolean): String? = when {
    dependencyCount.coerceAtLeast(0) {
        else -> null
    }
}
'''
          # Write the actual helper explicitly; the odd temporary string above is never inserted.
          dependency_helper = '''internal fun cookingDependencyLabel(dependencyCount: Int, isTurkish: Boolean): String? = when {
    dependencyCount {
        1 -> if (isTurkish) "Önceki adımın ardından" else "After the previous step"
        in 2..Int.MAX_VALUE -> if (isTurkish) "Önceki adımlar tamamlanınca" else "After the previous steps"
        else -> null
    }
}

'''
          if dependency_helper not in text:
              if helper_marker not in text:
                  raise SystemExit('OperationsScreen helper marker not found')
              text = text.replace(helper_marker, dependency_helper + helper_marker, 1)
          operations.write_text(text)

          test = Path('app-android/src/test/java/com/agentickitchen/android/ui/VisibleCookingCopyTest.kt')
          test.write_text('''package com.agentickitchen.android.ui

import org.junit.Assert.assertEquals
import org.junit.Assert.assertNull
import org.junit.Test

class VisibleCookingCopyTest {
    @Test
    fun `offline source label is localized for visible recipe cards`() {
        assertEquals("ÇEVRİMDIŞI", localizedRecipeSourceLabel("Offline", true))
        assertEquals("OFFLINE", localizedRecipeSourceLabel("Offline", false))
        assertEquals("Google Gemini", localizedRecipeSourceLabel("Google Gemini", true))
        assertNull(localizedRecipeSourceLabel(null, true))
    }

    @Test
    fun `dependency labels never expose internal step ids`() {
        assertEquals("Önceki adımın ardından", cookingDependencyLabel(1, true))
        assertEquals("Önceki adımlar tamamlanınca", cookingDependencyLabel(2, true))
        assertEquals("After the previous step", cookingDependencyLabel(1, false))
        assertEquals("After the previous steps", cookingDependencyLabel(3, false))
        assertNull(cookingDependencyLabel(0, true))
    }
}
''')
      - name: Remove temporary patch workflow from final tree
        run: git rm .github/workflows/audited-copy-fix.yml
      - name: Commit audited fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-android/src/main/java/com/agentickitchen/android/ui/OptionsScreen.kt \
                  app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt \
                  app-android/src/test/java/com/agentickitchen/android/ui/VisibleCookingCopyTest.kt
          git diff --cached --check
          git commit -m "fix: localize visible cooking metadata"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
