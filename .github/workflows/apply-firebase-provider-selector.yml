name: Apply managed AI selector wiring

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-firebase-provider-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply selector patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-firebase-provider-selector.yml
          git add app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt app-android/src/main/java/com/agentickitchen/android/ui/SettingsScreen.kt app-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt
          git commit -m 'feat: expose managed Firebase AI provider'
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
