name: Phase 6 recipe import wiring

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase6-recipe-import-wiring-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply Phase 6 recipe import wiring patch
        run: python3 .github/scripts/phase6_recipe_import_wiring_patch.py
      - name: Validate Phase 6 recipe import wiring
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase6-recipe-import-wiring-patch.yml .github/scripts/phase6_recipe_import_wiring_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: wire recipe import review and sharing"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
