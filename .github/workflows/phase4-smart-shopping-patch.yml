name: Phase 4 smart shopping patch

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase4-smart-shopping-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply Phase 4 source patch
        run: python3 .github/scripts/phase4_smart_shopping_patch.py
      - name: Repair generated validation anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('shared/src/test/kotlin/com/agentickitchen/shared/inventory/SmartShoppingTest.kt')
          text = test.read_text(encoding='utf-8').replace('UnitDimension.MASS', 'UnitDimension.WEIGHT')
          test.write_text(text, encoding='utf-8')

          ops = Path('app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt')
          text = ops.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.BorderStroke\n' not in text:
              text = text.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.background\n', 1)
          if 'import androidx.compose.material.OutlinedButton\n' not in text:
              text = text.replace('import androidx.compose.material.MaterialTheme\n', 'import androidx.compose.material.MaterialTheme\nimport androidx.compose.material.OutlinedButton\n', 1)
          ops.write_text(text, encoding='utf-8')

          migration_test = Path('shared/src/test/kotlin/com/agentickitchen/shared/inventory/MetadataPantryInventoryRepositoryTest.kt')
          text = migration_test.read_text(encoding='utf-8')
          text = text.replace('assertEquals(4L, AppDatabase.Schema.version)', 'assertEquals(5L, AppDatabase.Schema.version)', 1)
          text = text.replace('AppDatabase.Schema.migrate(legacyDriver, 3L, 4L)', 'AppDatabase.Schema.migrate(legacyDriver, 3L, 5L)', 1)
          anchor = '''            val migratedRepository = MetadataPantryInventoryRepository(\n                SqlDelightPantryInventoryRepository(migratedDatabase),\n                migratedDatabase\n            )\n            val restored = migratedRepository.getAll().single()\n'''
          replacement = '''            val migratedRepository = MetadataPantryInventoryRepository(\n                SqlDelightPantryInventoryRepository(migratedDatabase),\n                migratedDatabase\n            )\n            assertEquals(emptyList<ShoppingListItem>(), SqlDelightShoppingListRepository(migratedDatabase).getAll())\n            val restored = migratedRepository.getAll().single()\n'''
          if anchor not in text:
              raise SystemExit('migration coverage anchor missing')
          text = text.replace(anchor, replacement, 1)
          migration_test.write_text(text, encoding='utf-8')

          vm_test = Path('app-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt')
          text = vm_test.read_text(encoding='utf-8')
          anchor = '''            FakeProviderFactory,\n            TargetTimeResolver()\n        )\n'''
          replacement = '''            FakeProviderFactory,\n            TargetTimeResolver(),\n            com.agentickitchen.shared.inventory.InMemoryShoppingListRepository()\n        )\n'''
          if anchor not in text:
              raise SystemExit('AppViewModelFactory test fixture anchor missing')
          text = text.replace(anchor, replacement, 1)
          vm_test.write_text(text, encoding='utf-8')
          PY
      - name: Validate Phase 4 source patch
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase4-smart-shopping-patch.yml .github/scripts/phase4_smart_shopping_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add persistent smart shopping"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
