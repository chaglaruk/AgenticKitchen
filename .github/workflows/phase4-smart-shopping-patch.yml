name: Phase 4 smart shopping patch

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase4-smart-shopping-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply Phase 4 source patch
        run: python3 .github/scripts/phase4_smart_shopping_patch.py
      - name: Repair generated compile anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('shared/src/test/kotlin/com/agentickitchen/shared/inventory/SmartShoppingTest.kt')
          text = test.read_text(encoding='utf-8').replace('UnitDimension.MASS', 'UnitDimension.WEIGHT')
          test.write_text(text, encoding='utf-8')

          ops = Path('app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt')
          text = ops.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.BorderStroke\n' not in text:
              text = text.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.background\n', 1)
          if 'import androidx.compose.material.OutlinedButton\n' not in text:
              text = text.replace('import androidx.compose.material.MaterialTheme\n', 'import androidx.compose.material.MaterialTheme\nimport androidx.compose.material.OutlinedButton\n', 1)
          ops.write_text(text, encoding='utf-8')
          PY
      - name: Validate Phase 4 source patch
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase4-smart-shopping-patch.yml .github/scripts/phase4_smart_shopping_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add persistent smart shopping"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
