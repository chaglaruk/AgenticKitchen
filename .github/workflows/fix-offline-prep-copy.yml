name: Fix offline prep copy

on:
  push:
    branches:
      - refactor/agentic-kitchen-production-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply audited offline prep copy fix
        run: |
          echo '' | base64 -d > /tmp/fix_prep.py
          python3 /tmp/fix_prep.py
      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-offline-prep-copy.yml
      - name: Commit and push audited fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-android/src/main/java/com/agentickitchen/android/ai/LocalRecipeProvider.kt app-android/src/test/java/com/agentickitchen/android/ai/LocalRecipeProviderTest.kt
          git diff --cached --check
          git commit -m "fix: make offline prep instructions ingredient-aware"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
