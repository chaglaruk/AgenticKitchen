name: Phase 6 recipe import core

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase6-recipe-import-core-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply Phase 6 import core patch
        run: python3 .github/scripts/phase6_recipe_import_core_patch.py
      - name: Repair shared test imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'import org.junit.Assert.assertEquals\n': 'import kotlin.test.assertEquals\n',
              'import org.junit.Assert.assertFalse\n': 'import kotlin.test.assertFalse\n',
              'import org.junit.Assert.assertNotNull\n': 'import kotlin.test.assertNotNull\n',
              'import org.junit.Assert.assertNull\n': 'import kotlin.test.assertNull\n',
              'import org.junit.Assert.assertTrue\n': 'import kotlin.test.assertTrue\n',
              'import org.junit.Test\n': 'import kotlin.test.Test\n',
          }
          for path in [
              Path('shared/src/test/kotlin/com/agentickitchen/shared/ai/RecipeImportParserTest.kt'),
              Path('shared/src/test/kotlin/com/agentickitchen/shared/inventory/RecipeImportPantryPlannerTest.kt'),
          ]:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Phase 6 import core
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase6-recipe-import-core-patch.yml .github/scripts/phase6_recipe_import_core_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic recipe import core"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
