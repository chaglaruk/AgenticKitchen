name: Fix visible plan units

on:
  push:
    branches:
      - refactor/agentic-kitchen-production-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply audited unit localization fix
        run: |
          echo '' | base64 -d > /tmp/fix_units.py
          python3 /tmp/fix_units.py
      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-visible-plan-units.yml
      - name: Commit and push audited fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt app-android/src/test/java/com/agentickitchen/android/ui/VisibleCookingCopyTest.kt
          git diff --cached --check
          git commit -m "fix: localize visible cooking plan units"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
