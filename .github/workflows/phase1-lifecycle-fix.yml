name: One-shot Phase 1 cooking lifecycle fix

on:
  push:
    branches:
      - "refactor/agentic-kitchen-production-foundation"
    paths:
      - ".github/workflows/phase1-lifecycle-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0

      - name: Apply narrowly scoped lifecycle patch and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm_path = Path('app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt')
          lines = vm_path.read_text(encoding='utf-8').splitlines()

          def function_region(signature, next_signature):
              starts = [i for i, line in enumerate(lines) if line.strip() == signature]
              if len(starts) != 1:
                  raise SystemExit(f'Expected one {signature}, found {len(starts)}')
              start = starts[0]
              ends = [i for i in range(start + 1, len(lines)) if lines[i].strip() == next_signature]
              if len(ends) != 1:
                  raise SystemExit(f'Expected one next boundary {next_signature}, found {len(ends)}')
              return start, ends[0]

          # 1. Repair stale persisted RUNNING records when restore() reconciles them to terminal state.
          restore_start, restore_end = function_region('private fun restoreActiveSession() {', 'private fun persistActiveSession() {')
          restore_region = lines[restore_start:restore_end]
          ticker_calls = [i for i, line in enumerate(restore_region) if line.strip() == 'startCookingTicker()']
          if len(ticker_calls) != 1:
              raise SystemExit(f'Expected one restore ticker call, found {len(ticker_calls)}')
          call_abs = restore_start + ticker_calls[0]
          close_abs = call_abs + 1
          if lines[close_abs].strip() != '}':
              raise SystemExit('Unexpected restore ticker block shape')
          repair_lines = [
              '            } else if (restoredStatus == CookingSessionStatus.RUNNING) {',
              '                // Repair pre-fix RUNNING records that become terminal after wall-clock reconciliation.',
              '                persistActiveSession()',
              '                exposePendingConsumption()',
          ]
          lines[close_abs:close_abs + 1] = repair_lines + ['            }']

          # 2. Make Back lifecycle-safe: active cooking cannot be abandoned and terminal reserved usage must reconcile first.
          back_start, back_end = function_region('fun backToOptions() {', 'fun startCooking() {')
          replacement = [
              '    fun backToOptions() {',
              '        val currentState = _planState.value',
              '        if (currentState is PlanState.RecipeActive) {',
              '            val status = _cookingState.value.status',
              '            if (status in setOf(CookingSessionStatus.RUNNING, CookingSessionStatus.PAUSED)) {',
              '                emitUiEvent(',
              '                    if (L.isTr) "Devam eden pişirmeyi bitirmeden tariflere dönemezsin."',
              '                    else "Finish the active cooking session before returning to recipes."',
              '                )',
              '                return',
              '            }',
              '            val hasPendingReconciliation = inventoryRepository.pendingUsage(currentState.sessionId)',
              '                .any { it.status == "reserved" }',
              '            if (hasPendingReconciliation) {',
              '                exposePendingConsumption()',
              '                emitUiEvent(',
              '                    if (L.isTr) "Önce stok kullanımını onayla veya iptal et."',
              '                    else "Confirm or cancel pantry usage before returning to recipes."',
              '                )',
              '                return',
              '            }',
              '            inventoryRepository.deleteActiveSession(currentState.sessionId)',
              '            _cookingState.value = CookingSessionState()',
              '            if (lastOptions.isNotEmpty()) {',
              '                _planState.value = PlanState.OptionsReady(lastOptions)',
              '            } else {',
              '                startSession()',
              '            }',
              '        }',
              '    }',
              '',
          ]
          lines[back_start:back_end] = replacement

          # 3. Persist automatic RUNNING -> terminal transitions before exposing consumption reconciliation.
          ticker_start, ticker_end = function_region('private fun startCookingTicker() {', 'private fun stopTickerIfFinished() {')
          ticker_region = lines[ticker_start:ticker_end]
          exposes = [i for i, line in enumerate(ticker_region) if line.strip() == 'exposePendingConsumption()']
          if len(exposes) != 1:
              raise SystemExit(f'Expected one ticker expose call, found {len(exposes)}')
          expose_abs = ticker_start + exposes[0]
          if lines[expose_abs - 1].strip() == 'persistActiveSession()':
              raise SystemExit('Ticker persistence already present unexpectedly')
          lines.insert(expose_abs, '                    persistActiveSession()')

          vm_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Focused ViewModel regressions reuse the existing fakes in AppViewModelTest.
          test_path = Path('app-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n    private fun newViewModel('
          if tests.count(marker) != 1:
              raise SystemExit('Expected exactly one AppViewModelTest insertion marker')

          if 'staleRunningSessionIsPersistedAsCompletedWhenRestoreFindsElapsedPlan' not in tests:
              new_tests = '\n'.join([
                  '',
                  '    @Test',
                  '    fun staleRunningSessionIsPersistedAsCompletedWhenRestoreFindsElapsedPlan() {',
                  '        val inventory = FakeInventoryRepository()',
                  '        val now = System.currentTimeMillis()',
                  '        inventory.saveActiveSession(',
                  '            ActiveCookingSessionRecord(',
                  '                sessionId = "stale-session",',
                  '                recipeOptionId = "option",',
                  '                recipeName = "Timed recipe",',
                  '                recipeType = "test",',
                  '                description = "description",',
                  '                servings = 2,',
                  '                resolvedReadyTimeIso = "2026-08-30T12:00:00Z",',
                  '                cookingPlanJson = """{"recipeName":"Timed recipe","servings":2,"ingredients":[],"steps":[],"safetyNotes":[]}""",',
                  '                eventsJson = """[{"id":"step","startIso":"2026-08-30T12:00:00Z","endIso":"2026-08-30T12:00:01Z","instruction":"Wait","resource":"counter"}]""",',
                  '                plannedUsageJson = "[]",',
                  '                status = "RUNNING",',
                  '                startedAtMillis = now - 120_000,',
                  '                accumulatedElapsedSeconds = 0,',
                  '                lastRunningStartMillis = now - 120_000,',
                  '                pausedAtMillis = null,',
                  '                completedStepIdsJson = "[]",',
                  '                skippedStepIdsJson = "[]",',
                  '                recentChatTurnsJson = "[]",',
                  '                updatedAtIso = "2026-08-30T12:00:00Z"',
                  '            )',
                  '        )',
                  '',
                  '        newViewModel(FakePreferences(), FakeHistoryRepository(), inventory = inventory)',
                  '',
                  '        assertEquals("COMPLETED", inventory.getActiveSession("stale-session")?.status)',
                  '    }',
                  '',
                  '    @Test',
                  '    fun completedRestoredSessionWithoutPendingUsageIsDeletedWhenReturningToRecipes() {',
                  '        val inventory = FakeInventoryRepository()',
                  '        val now = System.currentTimeMillis()',
                  '        inventory.saveActiveSession(',
                  '            ActiveCookingSessionRecord(',
                  '                sessionId = "completed-session",',
                  '                recipeOptionId = "option",',
                  '                recipeName = "Completed recipe",',
                  '                recipeType = "test",',
                  '                description = "description",',
                  '                servings = 2,',
                  '                resolvedReadyTimeIso = "2026-08-30T12:00:00Z",',
                  '                cookingPlanJson = """{"recipeName":"Completed recipe","servings":2,"ingredients":[],"steps":[],"safetyNotes":[]}""",',
                  '                eventsJson = "[]",',
                  '                plannedUsageJson = "[]",',
                  '                status = "COMPLETED",',
                  '                startedAtMillis = now - 120_000,',
                  '                accumulatedElapsedSeconds = 120,',
                  '                completedStepIdsJson = "[]",',
                  '                skippedStepIdsJson = "[]",',
                  '                recentChatTurnsJson = "[]",',
                  '                updatedAtIso = "2026-08-30T12:00:00Z"',
                  '            )',
                  '        )',
                  '        val viewModel = newViewModel(FakePreferences(), FakeHistoryRepository(), inventory = inventory)',
                  '',
                  '        viewModel.backToOptions()',
                  '',
                  '        assertEquals(null, inventory.getActiveSession("completed-session"))',
                  '    }',
                  '',
              ])
              tests = tests.replace(marker, new_tests + marker, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          expected=$'app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt\napp-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff --stat
          git diff -- app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt app-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt app-android/src/test/java/com/agentickitchen/android/AppViewModelTest.kt
          git commit -m "fix: persist terminal cooking lifecycle"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
