name: Phase 2 guard patch

on:
  push:
    branches:
      - refactor/agentic-kitchen-production-foundation
    paths:
      - .github/workflows/phase2-guard-patch.yml
      - .github/scripts/phase2_guard_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0

      - name: Apply Phase 2 guard patch
        run: python3 .github/scripts/phase2_guard_patch.py

      - name: Validate Phase 2 guard patch
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug

      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase2-guard-patch.yml .github/scripts/phase2_guard_patch.py
          git add app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt \
                  app-android/src/main/java/com/agentickitchen/android/ui/OptionsScreen.kt \
                  app-android/src/test/java/com/agentickitchen/android/ui/RecipeOptionsUiTest.kt \
                  .github/workflows/phase2-guard-patch.yml \
                  .github/scripts/phase2_guard_patch.py
          git commit -m "fix: enforce pantry idea preparation guard"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
