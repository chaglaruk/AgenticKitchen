name: Phase 3 substitution patch

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase3-substitution-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Repair patch harness test tail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/phase3_substitution_patch.py')
          text = p.read_text(encoding='utf-8')
          marker = '# Prompt guard test'
          if marker not in text:
              raise SystemExit('prompt test marker missing')
          p.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
      - name: Apply Phase 3 source patch
        run: python3 .github/scripts/phase3_substitution_patch.py
      - name: Repair generated compile anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('shared/src/test/kotlin/com/agentickitchen/shared/inventory/SubstitutionMutationValidatorTest.kt')
          text = test.read_text(encoding='utf-8')
          text = text.replace('import org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n', 'import kotlin.test.Test\nimport kotlin.test.assertFalse\nimport kotlin.test.assertTrue\n')
          test.write_text(text, encoding='utf-8')

          vm = Path('app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt')
          text = vm.read_text(encoding='utf-8')
          text = text.replace('CookingProviderSelection.provider(aiProviderFactory, _hardwareSettings.value)', 'CookingProviderSelection.provider(providerFactory, _hw.value)')
          text = text.replace('_hardwareSettings.value', '_hw.value')
          text = text.replace('_language.value', 'language.value')
          vm.write_text(text, encoding='utf-8')

          ops = Path('app-android/src/main/java/com/agentickitchen/android/ui/OperationsScreen.kt')
          text = ops.read_text(encoding='utf-8').replace('color = colors.error', 'color = MaterialTheme.colors.error')
          ops.write_text(text, encoding='utf-8')
          PY
      - name: Validate Phase 3 source patch
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase3-substitution-patch.yml .github/scripts/phase3_substitution_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add pantry-aware structured substitutions"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
