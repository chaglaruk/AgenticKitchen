name: Phase 2 integration patch

on:
  push:
    branches:
      - refactor/agentic-kitchen-production-foundation
    paths:
      - .github/workflows/phase2-integration-patch.yml
      - .github/scripts/phase2_integration_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0

      - name: Apply exact integration patch
        run: |
          sed -i 's/"""            Text(option.description/"""                Text(option.description/g; s/^            if (option.shortages.isNotEmpty()) {/                if (option.shortages.isNotEmpty()) {/g' .github/scripts/phase2_integration_patch.py
          python3 .github/scripts/phase2_integration_patch.py

      - name: Validate integration
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-android/src/main/java/com/agentickitchen/android/AppViewModel.kt \
                  app-android/src/main/java/com/agentickitchen/android/ui/OptionsScreen.kt \
                  app-android/src/main/java/com/agentickitchen/android/ui/HomeScreen.kt
          git commit -m "feat: integrate deterministic recipe ranking"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
