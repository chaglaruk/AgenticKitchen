name: Phase 6 recipe import providers

on:
  push:
    branches: ['refactor/agentic-kitchen-production-foundation']
    paths:
      - '.github/workflows/phase6-recipe-import-provider-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/agentic-kitchen-production-foundation
          fetch-depth: 0
      - name: Apply Phase 6 provider patch
        run: python3 .github/scripts/phase6_recipe_import_provider_patch.py
      - name: Align redirect test fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app-android/src/test/java/com/agentickitchen/android/ai/RecipeImportUrlLoaderTest.kt')
          text = path.read_text(encoding='utf-8')
          old = 'val client = HttpClient(engine) { install(HttpTimeout) }'
          new = 'val client = HttpClient(engine) { followRedirects = false; install(HttpTimeout) }'
          if old not in text:
              raise SystemExit('Redirect fixture anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate Phase 6 provider patch
        run: |
          git diff --check
          git diff --stat
          ./gradlew :shared:test :app-android:testDebugUnitTest :app-android:lintDebug :app-android:assembleDebug
      - name: Commit source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase6-recipe-import-provider-patch.yml .github/scripts/phase6_recipe_import_provider_patch.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add source-faithful recipe import providers"
          git push origin HEAD:refactor/agentic-kitchen-production-foundation
