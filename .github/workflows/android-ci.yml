name: Android CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($error in $errors) {
              Write-Error ("{0}:{1}:{2} {3}" -f $_.FullName, $error.Extent.StartLineNumber, $error.Extent.StartColumnNumber, $error.Message)
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit

      - name: Check whitespace in change range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base_sha...HEAD"

      - name: Provision Firebase configuration
        shell: bash
        env:
          FIREBASE_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_B64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_B64 secret is missing or empty"
            exit 1
          fi
          echo "$FIREBASE_B64" | base64 -d > app-android/google-services.json
          if [ ! -s app-android/google-services.json ]; then
            echo "::error::Failed to decode app-android/google-services.json or file is empty"
            exit 1
          fi
          echo "Firebase configuration provisioned successfully."

      - name: Validate Google Play metadata
        run: ./gradlew :app-android:generateReleasePlayResources --no-daemon --console=plain

      - name: Clean
        run: ./gradlew clean --no-daemon --console=plain

      - name: Run shared module tests
        run: ./gradlew :shared:test --no-daemon --console=plain

      - name: Run Android unit tests
        run: ./gradlew :app-android:testDebugUnitTest --no-daemon --console=plain

      - name: Run Android lint
        run: ./gradlew :app-android:lintDebug --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon --console=plain

      - name: Verify Firebase Android resources in build
        shell: bash
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, zipfile, glob, sys, os

          res_path = 'app-android/build/generated/res/processDebugGoogleServices/values/values.xml'
          if not os.path.exists(res_path):
              print('ERROR: Firebase generated resources missing at ' + res_path, file=sys.stderr)
              sys.exit(1)
          root = ET.parse(res_path).getroot()
          names = sorted([e.attrib.get('name') for e in root if e.attrib.get('name')])
          required = {'google_app_id', 'project_id', 'google_api_key'}
          missing = required - set(names)
          if missing:
              print(f'ERROR: Missing expected Firebase resource names: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'Verified Firebase generated resource names in build output: {names}')

          apks = glob.glob('app-android/build/outputs/apk/debug/*.apk')
          if not apks:
              print('ERROR: Debug APK not found', file=sys.stderr)
              sys.exit(1)
          with zipfile.ZipFile(apks[0], 'r') as z:
              arsc = z.read('resources.arsc')
              if b'google_app_id' not in arsc or b'project_id' not in arsc:
                  print('ERROR: Firebase resource identifiers not found in APK resources.arsc', file=sys.stderr)
                  sys.exit(1)
          print('Verified Firebase resource entries compiled into debug APK resources.arsc.')
          "

      - name: Run full build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: error

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
